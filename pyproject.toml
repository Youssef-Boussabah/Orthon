[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "orthon"
version = "1.0.0rc1"
description = "Orthon: a compact C++17/CUDA tensor and autograd runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
maintainers = [{ name = "Youssef Boussabah" }]
keywords = ["tensor", "autograd", "cuda", "machine-learning", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime annotations require Python 3.10 or later.
requires-python = ">=3.10"

# NumPy supports runtime array imports and binding conversion; checkpoint
# payloads use raw bytes. This floor supplies wheels for Python 3.10.
dependencies = [
    "numpy>=1.21.3",
]

# Reference frameworks and pytest are test-only. Real dataset examples require
# torchvision separately; synthetic examples need no dataset download.
[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "torch>=2.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
# The runtime package source lives under python/orthon/ and is installed as the
# top-level `orthon` package; CMake installs the _C extension alongside it.
wheel.packages = ["python/orthon"]
# Source artifacts build the runtime too; repository test support stays in Git.
sdist.exclude = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/spec"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "regression: historical public regressions, parity and workloads",
    "spec: executable behavioral specifications",
    "architecture: source, ownership, build and package fences",
]
